name: rag-engineering    

services:
  lab:
    image: quay.io/jupyter/base-notebook:2026-08-24
    container_name: rag-lab
    ports:
      - "8888:8888"
    env_file:
      - path: .env
        required: false      # starts fine without one; add keys at module 02
    environment:
      JUPYTER_TOKEN: ""
      GRANT_SUDO: "yes"
      HF_HOME: /home/jovyan/.cache/huggingface
      # Named volumes are created root-owned. The entrypoint runs as root, fixes
      # ownership on these paths, then drops to the jovyan user.
      CHOWN_EXTRA: "/home/jovyan/.local,/home/jovyan/.cache"
      CHOWN_EXTRA_OPTS: "-R"
    user: root
    volumes:
      - .:/home/jovyan/work
      - lab-local:/home/jovyan/.local
      - hf-cache:/home/jovyan/.cache/huggingface
    working_dir: /home/jovyan/work
    command: >
      bash -c "pip install --no-cache-dir -q ipywidgets &&
               start-notebook.py --ServerApp.root_dir=/home/jovyan/work"

volumes:
  lab-local:
  hf-cache:      # so model weights survive a restart
